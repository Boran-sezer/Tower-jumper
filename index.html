<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
/* On s'assure que le body prend tout l'espace */
body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; }
#gw { position: relative; width: 100vw; height: 100vh; font-family: 'Press Start 2P', monospace; user-select: none; }
#hud { position: absolute; top: 20px; left: 0; width: 100%; display: flex; justify-content: space-around; z-index: 10; pointer-events: none; }
#hud span { font-size: 10px; text-shadow: 2px 2px #000; }
#sl { color: #f0e68c; } #bl { color: #7ec8e3; } #ll { color: #ff6b6b; }
canvas { display: block; image-rendering: pixelated; width: 100%; height: 100%; }
#ov { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; background: rgba(10, 10, 30, 0.9); z-index: 20; }
#ov h1 { color: #f0e68c; font-size: 20px; text-align: center; line-height: 1.5; }
#ov p { color: #aaa; font-size: 8px; text-align: center; line-height: 2; margin-bottom: 10px;}
.btn { background: #f0e68c; color: #1a1a2e; border: none; padding: 12px 24px; font-family: 'Press Start 2P', monospace; font-size: 11px; cursor: pointer; border-radius: 4px; width: 220px; }
#fs-btn { background: #3498db; color: white; margin-top: 10px; }
#hint { position: absolute; bottom: 20px; width: 100%; color: #f0e68c; font-size: 8px; text-align: center; opacity: .6; z-index: 10; }
</style>

<div id="gw">
  <div id="hud">
    <span id="sl">SCORE: 0</span>
    <span id="bl">BEST: 0</span>
    <span id="ll">❤❤❤</span>
  </div>
  <canvas id="c"></canvas>
  <div id="ov">
    <h1>⬛ TOWER<br>JUMPER ⬛</h1>
    <p>Empilez les blocs !<br>3 vies — bonne chance !</p>
    <button id="sb" class="btn">► JOUER</button>
    <button id="fs-btn" class="btn">⛶ PLEIN ÉCRAN</button>
  </div>
  <div id="hint">ESPACE / CLIC / TAP pour sauter</div>
</div>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),gw=document.getElementById('gw');
let W, H; 
const BW=52, BH=16, GRAV=0.52, JUMP=-11;
const COLS=['#e74c3c','#e67e22','#f1c40f','#2ecc71','#1abc9c','#3498db','#9b59b6','#e91e63','#00bcd4','#8bc34a'];
const SHADE={'#e74c3c':'#7b241c','#e67e22':'#784212','#f1c40f':'#7d6608','#2ecc71':'#1e8449','#1abc9c':'#148f77','#3498db':'#1a5276','#9b59b6':'#6c3483','#e91e63':'#78033a','#00bcd4':'#00838f','#8bc34a':'#33691e'};

let state='idle',score=0,best=0,lives=3,tower=[],fb=null,pl=null,stars=[],camY=0,jq=false;

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = W;
    cv.height = H;
    if(state === 'idle') genStars();
}

function toggleFS() {
    if (!document.fullscreenElement) {
        gw.requestFullscreen().catch(err => {
            alert(`Erreur plein écran: ${err.message}`);
        });
    } else {
        document.exitFullscreen();
    }
}

const r=(a,b)=>Math.random()*(b-a)+a;
const ri=(a,b)=>Math.floor(r(a,b+1));

function genStars(){stars=[];for(let i=0;i<100;i++)stars.push({x:r(0,W),y:r(-5000,H),s:r(0.5,2),p:r(0,Math.PI*2)});}
function col(){return COLS[ri(0,COLS.length-1)];}

function newFB(worldY){
  const spd=Math.min(2.5+score*0.1, 8.5);
  return{x:0, y:worldY-BH, w:BW, h:BH, c:col(), spd, dir:1};
}

function startGame(){
  score=0;lives=3;jq=false;tower=[];
  const BASE=H*0.8;
  for(let i=0;i<4;i++)tower.push({x:W/2-BW/2,y:BASE-i*BH,w:BW,h:BH,c:COLS[3]});
  const top=tower[tower.length-1];
  pl={x:top.x+BW/2-6,y:top.y-22,w:12,h:22,vy:0,grnd:true,cd:0,c:'#f0e68c'};
  fb=newFB(top.y);
  camY=0;
  updateHUD();state='play';
  document.getElementById('ov').style.display='none';
}

function updateHUD(){
  document.getElementById('sl').textContent='SCORE: '+score;
  document.getElementById('bl').textContent='BEST: '+best;
  document.getElementById('ll').textContent='❤'.repeat(lives)+'♡'.repeat(Math.max(0,3-lives));
}

function jump(){
  if(state!=='play')return;
  if(pl.grnd&&pl.cd<=0){pl.vy=JUMP;pl.grnd=false;jq=false;}
  else jq=true;
}

function worldToScreen(worldY){return worldY-camY;}

function update(){
  if(state!=='play')return;
  fb.x+=fb.spd*fb.dir;
  if(fb.x+fb.w>=W){fb.dir=-1;fb.x=W-fb.w;}
  if(fb.x<=0){fb.dir=1;fb.x=0;}

  if(!pl.grnd){
    pl.vy+=GRAV;
    pl.y+=pl.vy;
    const pBot=pl.y+pl.h, pBotPrev=pBot-pl.vy, cx=pl.x+pl.w/2;

    if(pl.vy>0&&pBotPrev<=fb.y&&pBot>=fb.y&&cx>=fb.x&&cx<=fb.x+fb.w){
      landOnFB();return;
    }
    const top=tower[tower.length-1];
    if(pl.vy>0&&pBotPrev<=top.y&&pBot>=top.y&&cx>=top.x&&cx<=top.x+top.w){
      pl.y=top.y-pl.h;pl.vy=0;pl.grnd=true;pl.cd=10;return;
    }
    if(worldToScreen(pl.y)>H+100){miss();return;}
  }else{
    pl.cd--;
    if(jq&&pl.cd<=0){pl.vy=JUMP;pl.grnd=false;jq=false;}
  }
  const targetCam=pl.y-(H*0.6);
  camY+=(targetCam-camY)*0.1;
}

function landOnFB(){
  const top=tower[tower.length-1];
  const nb={x:fb.x,y:top.y-BH,w:BW,h:BH,c:fb.c};
  tower.push(nb);
  pl.y=nb.y-pl.h;pl.vy=0;pl.grnd=true;pl.cd=10;
  score++;if(score>best)best=score;
  fb=newFB(nb.y);
  updateHUD();
}

function miss(){
  lives--;updateHUD();
  if(lives<=0){state='over';showOv('GAME OVER','Score final : '+score,'↺ REJOUER');return;}
  const top=tower[tower.length-1];
  pl.x=top.x+BW/2-6;pl.y=top.y-pl.h;pl.vy=0;pl.grnd=true;pl.cd=10;
  fb=newFB(top.y);
}

function showOv(t,s,btn){
  const o=document.getElementById('ov');
  o.style.display='flex';
  o.innerHTML=`<h1>${t}</h1><p>${s}</p><button id="sb" class="btn">${btn}</button><button id="fs-btn" class="btn">⛶ PLEIN ÉCRAN</button>`;
  document.getElementById('sb').addEventListener('click',startGame);
  document.getElementById('fs-btn').addEventListener('click',toggleFS);
}

function drawBlock(wx,wy,w,h,c){
  const sy=worldToScreen(wy);
  if(sy>H+h||sy+h<-h)return;
  ctx.fillStyle=c;ctx.fillRect(wx,sy,w,h);
  ctx.fillStyle=SHADE[c]||'#333';ctx.fillRect(wx,sy+h-4,w,4);
  ctx.fillStyle='rgba(255,255,255,0.25)';ctx.fillRect(wx,sy,w,3);
}

function drawFB(){
  const sy=worldToScreen(fb.y);
  ctx.fillStyle=fb.c;ctx.fillRect(fb.x,sy,fb.w,fb.h);
  ctx.fillStyle=SHADE[fb.c]||'#333';ctx.fillRect(fb.x,sy+fb.h-4,fb.w,4);
  ctx.fillStyle='rgba(255,255,255,0.3)';ctx.fillRect(fb.x,sy,fb.w,2);
}

function drawChar(){
  const sx=pl.x,sy=worldToScreen(pl.y);
  ctx.fillStyle='#fde3a7';ctx.fillRect(sx+2,sy,8,7);
  ctx.fillStyle='#333';ctx.fillRect(sx+3,sy+2,2,2);ctx.fillRect(sx+7,sy+2,2,2);
  ctx.fillStyle=pl.c;ctx.fillRect(sx,sy+7,12,9);
  ctx.fillRect(sx-3,sy+7,3,7);ctx.fillRect(sx+12,sy+7,3,7);
  ctx.fillStyle='#e8c99a';ctx.fillRect(sx+1,sy+16,4,5);ctx.fillRect(sx+7,sy+16,4,5);
}

function draw(){
  ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,W,H);
  stars.forEach(s=>{
    s.p+=0.01;
    const a=0.2+0.3*Math.sin(s.p);
    ctx.fillStyle=`rgba(255,255,255,${a.toFixed(2)})`;
    const sy=worldToScreen(s.y);
    if(sy>-10&&sy<H+10)ctx.fillRect(s.x,sy,s.s,s.s);
  });
  tower.forEach(b=>drawBlock(b.x,b.y,b.w,b.h,b.c));
  if(fb)drawFB();
  if(pl)drawChar();
}

function loop(){update();draw();requestAnimationFrame(loop);}

window.addEventListener('resize', resize);
resize();
loop();

document.getElementById('sb').addEventListener('click',startGame);
document.getElementById('fs-btn').addEventListener('click',toggleFS);
window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump();}});
cv.addEventListener('pointerdown',e=>{e.preventDefault();jump();});
</script>
